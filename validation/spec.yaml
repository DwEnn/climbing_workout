    purpose: trunk endurance and integrated body tension
    timing: standalone_core_day
    frequency_per_week: "1"
    duration_minutes: "30-40"
    exercises:
      - id: ex1
        title: 데드버그
        slot: motor_control_anti_rotation
        page_declared_evidence: mixed
      - id: ex2
        title: 링 롤아웃
        slot: anti_extension
        page_declared_evidence: direct
      - id: ex3
        title: 밴드 안티로테이션 할로우 홀드
        slot: anti_rotation
        page_declared_evidence: direct
      - id: ex4
        title: 행잉 니레이즈 / 레그레이즈
        slot: hanging_hip_flexion
        page_declared_evidence: direct
      - id: ex6
        title: 밴드 사이드 플랭크
        slot: anti_lateral_flexion
        page_declared_evidence: direct
      - id: ex8
        title: 턱 프론트 레버 프로그레션
        slot: integrated_pull_core
