  power:
    guide: guides/power-training-guide.html
    purpose: explosive whole-body power and landing control
    timing: fresh_before_climbing_or_light_day
    frequency_per_week: "1-2"
    duration_minutes: "25-35"
    exercises:
      - id: ex1
        title: 파워 풀업
        slot: explosive_pull
        page_declared_evidence: direct
      - id: ex2
        title: 파워 푸쉬업
        slot: explosive_push
        page_declared_evidence: direct
      - id: ex3
        title: 스쿼트 점프 + 스틱 랜딩
        slot: bilateral_lower_power
        page_declared_evidence: mixed
      - id: ex4
        title: 점프 런지
        slot: unilateral_lower_power
        page_declared_evidence: mixed
      - id: ex5
        title: 낮은 싱글레그 홉-앤-스틱
        slot: lateral_landing_control
