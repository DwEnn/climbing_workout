version: 1
audited_at: 2026-07-29
scope:
  sessions: 4
  exercises: 21
  method: >
    Current exercises and two same-slot alternatives were scored on evidence
    accuracy (30), goal and pattern fit (25), session integration (20),
    equipment and time fit (15), and usability and progression (10).
    Current adoption status was hidden while candidates were scored.
  selection_regret_threshold: 5
  hard_failure_scope: >
    Evidence attribution failures block the current guide card from
    publication. The exercise-selection disposition can still be revise when
    the movement is valid and the claim can be corrected. Equipment and safety
    failures apply directly to exercise selection.

