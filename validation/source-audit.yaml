    verified_tiers: [2]
    score: {evidence_accuracy: 10, goal_and_pattern_fit: 21, session_integration: 12, equipment_and_time_fit: 11, usability_and_progression: 7, total: 61}
    disposition: replace
    hard_failures: [unsupported_or_misattributed_direct_claim]
    issue: Hörst's published five-exercise core routine does not include an L-Sit; the current direct attribution is unverified.
    source_keys: [horst_core]
    alternatives:
      - {name: Ring rollout, score: 87, source_key: horst_core}
      - {name: Tuck L-hang, score: 73, source_key: gripped_lhang}

