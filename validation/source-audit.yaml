session_findings:
  push:
    score_mean: 78.3
    verdict: revise
    key_issue: >
      OHP is well supported, but three hard press slots overlap. Alternate
      push-up and ring dip instead of doing both after OHP.
  core:
    score_mean: 74.8
    verdict: redesign
    key_issue: >
      The page attributes exercises to Hörst that are not in his published
      five-exercise core routine and combines 24 sets with excessive hanging
      and pulling fatigue.
  power:
    score_mean: 76.5
    verdict: redesign
    key_issue: >
      Several author credentials are wrong, a non-climber ankle trial is
      presented too directly, and six exercises make a low-quality power
      session after accumulated fatigue.
  finger_extensor:
    score_mean: 60.0
    verdict: replace_protocol
    key_issue: >
      The movement is reasonable, but the daily 4-6-set low-load dosage and
      injury-prevention promise are not supported by the cited sources.

