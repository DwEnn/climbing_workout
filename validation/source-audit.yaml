exercises:
  - key: push.ex1
    current: 견갑골 푸쉬업
    slot: scapular_activation
    verified_evidence: principle
    verified_tiers: [3]
    score: {evidence_accuracy: 18, goal_and_pattern_fit: 22, session_integration: 18, equipment_and_time_fit: 14, usability_and_progression: 7, total: 79}
    disposition: revise
    hard_failures: [unsupported_or_misattributed_direct_claim]
    issue: Vagy does not directly prescribe this movement; use McClure's push-up plus source and soften the chicken-wing claim.
    source_keys: [vagy_antagonist, mcclure_schedule]
    alternatives:
      - {name: Serratus punch, score: 84, source_key: mcclure_schedule}
      - {name: Band reach, score: 82, source_key: vagy_antagonist}

  - key: push.ex2
    current: KB 오버헤드 프레스
    slot: vertical_press
    verified_evidence: mixed
    verified_tiers: [2]
    score: {evidence_accuracy: 26, goal_and_pattern_fit: 23, session_integration: 16, equipment_and_time_fit: 13, usability_and_progression: 9, total: 87}
    disposition: retain
    hard_failures: []
    issue: Bechtel directly recommends OHP, while the anti-rotation transfer and exact 3-set prescription are principle-based.
    source_keys: [bechtel_press]
    alternatives:
      - {name: Pike push-up, score: 85, source_key: mcclure_schedule}
      - {name: Band shoulder press, score: 78, source_key: lattice_antagonist}

  - key: push.ex3
    current: 링/다이아몬드 푸쉬업
    slot: horizontal_press
    verified_evidence: mixed
    verified_tiers: [2, 4, A]
    score: {evidence_accuracy: 20, goal_and_pattern_fit: 23, session_integration: 11, equipment_and_time_fit: 15, usability_and_progression: 8, total: 77}
    disposition: replace
    hard_failures: []
    issue: Floor push-ups are directly supported, but ring and diamond variants are principle applications and duplicate the dip slot.
    source_keys: [lattice_structure, lattice_antagonist, climbing_antagonist]
    alternatives:
      - {name: Floor push-up, score: 85, source_key: climbing_antagonist}
      - {name: Single-arm KB floor press, score: 78, source_key: hooper_press}

  - key: push.ex4
    current: 링 딥스
    slot: high_intensity_press
    verified_evidence: mixed
    verified_tiers: [2, 3]
    score: {evidence_accuracy: 18, goal_and_pattern_fit: 23, session_integration: 8, equipment_and_time_fit: 15, usability_and_progression: 7, total: 71}
    disposition: replace
    hard_failures: [unsupported_or_misattributed_direct_claim]
    issue: Hooper's preference is subjective, Climbing Magazine does not list dips, and the card omits the shoulder-instability depth condition.
    source_keys: [hooper_press, lattice_antagonist, vagy_antagonist]
    alternatives:
      - {name: Band eccentric triceps extension, score: 84, source_key: vagy_antagonist}
      - {name: Close-grip floor push-up, score: 79, source_key: mcclure_schedule}

  - key: push.ex5
    current: 페이스 풀/밴드 풀어파트
    slot: scapular_retraction_external_rotation
    verified_evidence: principle
    verified_tiers: [1, 3, 4]
    score: {evidence_accuracy: 18, goal_and_pattern_fit: 24, session_integration: 18, equipment_and_time_fit: 15, usability_and_progression: 8, total: 83}
    disposition: revise
    hard_failures: [unsupported_or_misattributed_direct_claim]
    issue: The cited sources do not prescribe face pulls; Wong and Ng is observational. A row-to-cactus citation can directly support the slot.
    source_keys: [wong_ng, climbing_antagonist]
    alternatives:
      - {name: Standing row-to-cactus, score: 88, source_key: climbing_antagonist}
      - {name: Bent-over letter T, score: 83, source_key: vagy_antagonist}

  - key: push.ex6
    current: 손목 신전근 훈련
    slot: wrist_extensor_prehab
    verified_evidence: mixed
    verified_tiers: [2, 3, 4, A]
    score: {evidence_accuracy: 17, goal_and_pattern_fit: 23, session_integration: 16, equipment_and_time_fit: 10, usability_and_progression: 7, total: 73}
    disposition: replace
    hard_failures: []
    issue: The exercise is directly recommended, but grip gains and injury prevention are overstated and the resistance setup is underspecified.
    source_keys: [climbing_antagonist, vagy_antagonist, lattice_antagonist, bechtel_grip]
    alternatives:
      - {name: Wrist extensor-up, score: 84, source_key: climbing_antagonist}
      - {name: Light reverse wrist curl, score: 82, source_key: bechtel_grip}

  - key: core.ex1
    current: 데드버그
    slot: motor_control_anti_rotation
    verified_evidence: direct
    verified_tiers: [3]
    score: {evidence_accuracy: 23, goal_and_pattern_fit: 23, session_integration: 15, equipment_and_time_fit: 12, usability_and_progression: 8, total: 81}
